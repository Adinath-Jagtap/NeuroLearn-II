{% extends "base.html" %}
{% block title %}Patient Login — NeuroLearn{% endblock %}
{% block content %}
<div class="auth-container" style="max-width: 440px; margin: 0 auto; padding-top: 40px;">
    <div class="auth-card" style="padding: 40px; border-radius: var(--radius-xl); border: 2px solid var(--border); background: var(--gradient-card);">
        
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="font-size: 56px; margin-bottom: 12px;">🔑</div>
            <h1 class="auth-title" style="font-family: var(--font-heading); font-size: 28px; margin-bottom: 8px;">
                Patient Login
            </h1>
            <p style="color: var(--text-secondary); font-size: 16px;">
                Enter your code and 4-digit PIN to log in.
            </p>
        </div>

        {% if error %}
        <div style="background: var(--accent-light); color: var(--accent); border: 1.5px solid var(--accent); padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-weight: 700; font-size: 15px;">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 800; margin-bottom: 8px; color: var(--text-primary); font-size: 16px;">
                    Patient Code
                </label>
                <input type="text" name="patient_code" required
                       placeholder="e.g. AB12CD"
                       maxlength="6"
                       style="width: 100%; padding: 18px 20px; border: 2.5px solid var(--border); border-radius: var(--radius-md); font-size: 28px; font-family: var(--font); background: var(--bg-card); color: var(--text-primary); text-align: center; letter-spacing: 6px; text-transform: uppercase; font-weight: 900;"
                       autofocus>
            </div>

            <div style="margin-bottom: 28px;">
                <label style="display: block; font-weight: 800; margin-bottom: 8px; color: var(--text-primary); font-size: 16px;">
                    4-Digit PIN
                </label>
                <input type="number" name="pin" required
                       placeholder="••••"
                       maxlength="4"
                       inputmode="numeric"
                       pattern="[0-9]{4}"
                       style="width: 100%; padding: 18px 20px; border: 2.5px solid var(--border); border-radius: var(--radius-md); font-size: 36px; font-family: var(--font); background: var(--bg-card); color: var(--text-primary); text-align: center; letter-spacing: 12px; font-weight: 900;">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 18px; font-size: 22px; font-weight: 800;">
                Login →
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; display: flex; flex-direction: column; gap: 8px;">
            <a href="/login" style="color: var(--text-muted); font-size: 14px; font-weight: 600;">
                Login with email instead
            </a>
            <p style="color: var(--text-muted); font-size: 13px;">
                Ask your caregiver for your code and PIN.
            </p>
        </div>
    </div>
</div>
{% endblock %}
